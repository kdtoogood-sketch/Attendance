<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f8f"/><stop offset="1" stop-color="#16245a"/>
    </linearGradient>
    <clipPath id="card"><rect x="128" y="112" width="256" height="288" rx="30"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- shadow -->
  <rect x="136" y="124" width="256" height="288" rx="30" fill="#0c1640" opacity=".35"/>
  <!-- card -->
  <rect x="128" y="112" width="256" height="288" rx="30" fill="#faf7f2"/>
  <g clip-path="url(#card)">
    <rect x="128" y="112" width="86" height="70" fill="#2c45a0"/>
    <rect x="214" y="112" width="85" height="70" fill="#ffffff"/>
    <rect x="299" y="112" width="85" height="70" fill="#d6334a"/>
  </g>
  <!-- binder rings -->
  <rect x="178" y="92" width="18" height="44" rx="9" fill="#e8e3da" stroke="#16245a" stroke-width="6"/>
  <rect x="316" y="92" width="18" height="44" rx="9" fill="#e8e3da" stroke="#16245a" stroke-width="6"/>
  <!-- check mark -->
  <path d="M186 288 L236 336 L330 228" fill="none" stroke="#1d2f6f" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
